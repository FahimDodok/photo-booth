<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fahim & Auni · Photo Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --navy: #0f1b3d;
      --gold: #c9a84c;
      --gold-dim: rgba(201,168,76,0.35);
      --gold-glow: rgba(201,168,76,0.12);
      --ivory: #fdf8f0;
      --ivory-dim: rgba(253,248,240,0.55);
      --ivory-faint: rgba(253,248,240,0.07);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--navy);
      color: var(--ivory);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Diamond pattern — CSS only, no extra HTTP request */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 0L80 40L40 80L0 40Z' fill='none' stroke='%23c9a84c' stroke-width='0.5' opacity='0.12'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* ── Header ── */
    header { text-align: center; padding: 44px 0 28px; }
    .header-eyebrow {
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .header-title {
      font-family: 'Great Vibes', cursive;
      font-size: 52px;
      color: var(--ivory);
      line-height: 1.1;
    }
    .gold-line {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 14px auto 0;
    }

    /* ── Camera card ── */
    .camera-card {
      background: var(--ivory-faint);
      border: 1px solid var(--gold-dim);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }
    .snap-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 52px 24px;
      cursor: pointer;
      position: relative;
    }
    .snap-label {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold);
    }
    .snap-hint {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ivory-dim);
    }
    #native-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* ── Preview wrapper ── */
    #preview-wrapper { position: relative; display: none; }
    #preview-img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      image-orientation: from-image;
    }
    #frame-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #sticker-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* ── Cancel btn ── */
    #cancel-btn {
      position: absolute;
      top: 12px; right: 12px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(15,27,61,0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--gold-dim);
      color: var(--ivory);
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.2s, transform 0.15s;
    }
    #cancel-btn:active { transform: scale(0.9); }

    /* ── Post-capture ── */
    #post-capture { display: none; padding: 0 16px 20px; }

    textarea {
      width: 100%;
      background: rgba(253,248,240,0.05);
      border: 1px solid var(--gold-dim);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--ivory);
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.55;
    }
    textarea::placeholder { color: rgba(253,248,240,0.3); }
    textarea:focus { border-color: var(--gold); }

    .action-row { display: flex; gap: 10px; margin-top: 12px; }

    .btn-flip {
      width: 100%;
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      padding: 9px 0;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 2px;
    }
    .btn-flip.active { background: var(--gold-glow); border-color: var(--gold); }

    .btn-outline {
      flex: 1;
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--ivory-dim);
      padding: 11px 0;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit {
      flex: 1;
      background: var(--gold);
      border: 1px solid var(--gold);
      color: var(--navy);
      padding: 11px 0;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Frame selector ── */
    .frame-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0 4px;
      margin-bottom: 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .frame-row::-webkit-scrollbar { display: none; }
    .frame-opt {
      flex-shrink: 0;
      width: 56px; height: 56px;
      border-radius: 10px;
      border: 1.5px solid var(--gold-dim);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--ivory-dim);
      text-align: center;
      line-height: 1.3;
      transition: all 0.2s;
      padding: 4px;
      position: relative;
    }
    .frame-opt.selected { border-color: var(--gold); background: var(--gold-glow); }
    .frame-opt.selected::after {
      content: '✓';
      position: absolute;
      top: 3px; right: 4px;
      font-size: 9px;
      color: var(--gold);
    }
    .frame-preview {
      width: 100%; height: 100%;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--ivory-dim);
    }

    /* ── Sticker tray ── */
    .sticker-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ivory-dim);
      margin: 8px 0 6px;
    }
    .sticker-tray { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .sticker-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1px solid var(--gold-dim);
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .sticker-btn:active { transform: scale(0.85); background: var(--gold-glow); }

    /* ── Placed sticker ── */
    .placed-sticker {
      position: absolute;
      font-size: 36px;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: all;
      line-height: 1;
      touch-action: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .placed-sticker:active { cursor: grabbing; }

    /* ── Done view ── */
    .done-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 48px 24px;
      text-align: center;
    }
    .done-icon { font-size: 44px; }
    .done-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--ivory);
    }
    .done-sub { font-size: 12px; color: var(--ivory-dim); line-height: 1.7; }
    .btn-again {
      margin-top: 4px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 10px 28px;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    /* ── Floating petals ── */
    .petal {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      z-index: 9999;
    }
    @keyframes float-petal-1 {
      0%   { transform: translateX(-80px)  translateY(0)     rotate(0deg);   opacity:1; }
      100% { transform: translateX(120px)  translateY(110vh) rotate(360deg); opacity:0; }
    }
    @keyframes float-petal-2 {
      0%   { transform: translateX(60px)   translateY(0)     rotate(0deg);    opacity:1; }
      100% { transform: translateX(-140px) translateY(110vh) rotate(-360deg); opacity:0; }
    }
    @keyframes float-petal-3 {
      0%   { transform: translateX(-40px)  translateY(0)     rotate(0deg);   opacity:1; }
      100% { transform: translateX(100px)  translateY(110vh) rotate(360deg); opacity:0; }
    }
    .petal-1 { animation: float-petal-1  7s linear forwards; }
    .petal-2 { animation: float-petal-2  8s linear forwards; }
    .petal-3 { animation: float-petal-3  9s linear forwards; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(24px);
      background: rgba(201,168,76,0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--gold-dim);
      border-radius: 40px;
      padding: 10px 22px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      white-space: nowrap;
      z-index: 9999;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(.32,.72,0,1), opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── Upload progress bar ── */
    #upload-progress {
      display: none;
      height: 3px;
      background: var(--gold-dim);
      border-radius: 2px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    #upload-progress-bar {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ── Gallery section (ivory) ── */
    .gallery-section {
      background: var(--ivory);
      position: relative;
      overflow: hidden;
      padding: 40px 0 48px;
      background-image:
        url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 10L60 40L90 50L60 60L50 90L40 60L10 50L40 40Z' fill='none' stroke='%23c9a84c' stroke-width='0.5' opacity='0.10'/%3E%3C/svg%3E"),
        url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='40' cy='40' r='30' fill='none' stroke='%23c9a84c' stroke-width='0.3' opacity='0.08'/%3E%3C/svg%3E");
      background-color: var(--ivory);
      background-position: 0 0, 40px 40px;
      background-repeat: repeat;
    }
    .gallery-inner {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }
    .g-corner {
      position: absolute;
      width: 52px; height: 52px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.35;
    }
    .g-corner.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
    .g-corner.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
    .g-corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
    .g-corner.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

    .section-label-dark {
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin: 0 0 6px;
    }
    .photo-count-dark {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(15,27,61,0.45);
      text-align: center;
      margin-bottom: 14px;
    }
    .photo-count-dark span { color: var(--navy); font-weight: 600; }
    .gallery-empty-dark {
      font-size: 13px;
      color: rgba(15,27,61,0.35);
      text-align: center;
      padding: 28px 0;
      width: 100%;
    }

    /* ── Gallery scroll ── */
    .gallery-track {
      display: flex;
      overflow-x: auto;
      gap: 14px;
      padding: 4px 0 12px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-dim) transparent;
    }
    .gallery-track::-webkit-scrollbar { height: 3px; }
    .gallery-track::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

    /* ── Gallery card ── */
    .g-card {
      flex-shrink: 0;
      width: 200px;
      background: white;
      border: 1px solid var(--gold-dim);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 12px rgba(15,27,61,0.08);
    }
    .g-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(15,27,61,0.12); }

    /* Thumbnail image — small, fast */
    .g-card .thumb {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      image-orientation: from-image;
      background: #f0ece4;
    }
    /* Skeleton loader while thumb loads */
    .g-card .thumb-skeleton {
      width: 100%;
      height: 240px;
      background: linear-gradient(90deg, #f0ece4 25%, #e8e2d9 50%, #f0ece4 75%);
      background-size: 200% 100%;
      animation: shimmer-load 1.4s infinite;
    }
    @keyframes shimmer-load {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .g-note {
      padding: 10px 12px;
      font-size: 12px;
      color: var(--navy);
      line-height: 1.5;
      border-top: 1px solid var(--gold-dim);
    }

    /* ── Load more button ── */
    #load-more-wrap {
      text-align: center;
      margin-top: 14px;
      display: none;
    }
    .btn-load-more {
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--navy);
      padding: 9px 24px;
      border-radius: 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-load-more:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(10,16,35,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #lightbox.open { display: flex; }
    #lightbox-img {
      max-width: 100%;
      max-height: 75dvh;
      border-radius: 14px;
      border: 1px solid var(--gold-dim);
      object-fit: contain;
      transition: opacity 0.3s;
    }
    #lightbox-img.loading { opacity: 0.3; }
    #lightbox-spinner {
      position: absolute;
      font-size: 24px;
      display: none;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #lightbox-note {
      margin-top: 14px;
      font-size: 13px;
      color: var(--ivory-dim);
      text-align: center;
      max-width: 320px;
      line-height: 1.6;
      font-style: italic;
    }
    #lightbox-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(253,248,240,0.08);
      border: 1px solid var(--gold-dim);
      color: var(--ivory);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    @media (max-width: 360px) {
      .header-title { font-size: 42px; }
      .g-card { width: 180px; }
    }
  </style>
</head>
<body>
<div class="page">

  <header>
    <p class="header-eyebrow">Photo Booth</p>
    <h1 class="header-title">Fahim & Auni</h1>
    <div class="gold-line"></div>
  </header>

  <div class="camera-card" id="camera-card">

    <div class="snap-area" id="snap-area">
      <span style="font-size:48px;">📷</span>
      <p class="snap-label">SNAP!</p>
      <p class="snap-hint">Tap to open camera</p>
      <input type="file" id="native-input" accept="image/*" capture>
    </div>

    <div id="preview-wrapper">
      <img id="preview-img" alt="Your photo preview">
      <canvas id="frame-canvas"></canvas>
      <div id="sticker-layer"></div>
      <button id="cancel-btn" onclick="retake()" title="Cancel">✕</button>
    </div>

    <div id="post-capture">
      <!-- Frame selector -->
      <div class="frame-row" id="frame-row">
        <button class="frame-opt selected" data-frame="none" onclick="selectFrame(this,'none')">
          <span style="font-size:18px;">🚫</span>
        </button>
        <button class="frame-opt" data-frame="gold" onclick="selectFrame(this,'gold')">
          <div class="frame-preview" style="border:3px solid #c9a84c;border-radius:4px;">
            <span style="font-size:8px;color:#c9a84c;">Gold</span>
          </div>
        </button>
        <button class="frame-opt" data-frame="stamp" onclick="selectFrame(this,'stamp')">
          <div class="frame-preview" style="border:2px dashed #c9a84c;border-radius:4px;padding:2px;">
            <span style="font-size:7px;color:#c9a84c;line-height:1.2;">F&A<br>2027</span>
          </div>
        </button>
        <button class="frame-opt" data-frame="hearts" onclick="selectFrame(this,'hearts')">
          <div class="frame-preview" style="font-size:22px;">💍</div>
        </button>
        <button class="frame-opt" data-frame="floral" onclick="selectFrame(this,'floral')">
          <div class="frame-preview" style="font-size:22px;">🌸</div>
        </button>
      </div>
      <!-- Sticker tray -->
      <p class="sticker-label">✦ Add stickers</p>
      <div class="sticker-tray">
        <button class="sticker-btn" onclick="addSticker('💍')">💍</button>
        <button class="sticker-btn" onclick="addSticker('🌸')">🌸</button>
        <button class="sticker-btn" onclick="addSticker('❤️')">❤️</button>
        <button class="sticker-btn" onclick="addSticker('🦋')">🦋</button>
        <button class="sticker-btn" onclick="addSticker('✨')">✨</button>
        <button class="sticker-btn" onclick="addSticker('🌺')">🌺</button>
        <button class="sticker-btn" onclick="addSticker('💛')">💛</button>
        <button class="sticker-btn" onclick="addSticker('🥂')">🥂</button>
      </div>
      <button class="btn-flip" id="flip-btn" onclick="toggleFlip()">🔁 Flip / Mirror</button>
      <!-- Upload progress -->
      <div id="upload-progress"><div id="upload-progress-bar"></div></div>
      <textarea id="note-input" rows="2" maxlength="160" placeholder="Leave a note or wish…"></textarea>
      <div class="action-row">
        <button class="btn-outline" onclick="retake()">Retake</button>
        <button class="btn-submit" id="submit-btn" onclick="submitPhoto()">Submit ✦</button>
      </div>
    </div>

    <div id="done-view" class="done-view">
      <span class="done-icon">✨</span>
      <p class="done-title">Thank you!</p>
      <p class="done-sub">Your photo has been shared.<br>Enjoy the celebration!</p>
      <button class="btn-again" onclick="takeAnother()">Take Another</button>
    </div>

  </div>

</div><!-- end .page -->

<!-- Gallery — ivory section -->
<div class="gallery-section">
  <div class="gallery-inner">
    <div class="g-corner tl"></div>
    <div class="g-corner tr"></div>
    <div class="g-corner bl"></div>
    <div class="g-corner br"></div>
    <p class="section-label-dark">✦ Guest Gallery ✦</p>
    <p class="photo-count-dark" id="photo-count" style="display:none;"><span id="photo-num">0</span> photos shared</p>
    <p class="gallery-empty-dark" id="gallery-empty" style="display:block;">No photos yet&nbsp;&nbsp;📸</p>
    <div class="gallery-track" id="gallery"></div>
    <div id="load-more-wrap">
      <button class="btn-load-more" onclick="loadMore()">Load more</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <span id="lightbox-spinner">⏳</span>
  <img id="lightbox-img" alt="Full photo">
  <p id="lightbox-note"></p>
</div>

<!-- Toast -->
<div class="toast" id="toast">✦ Photo shared successfully!</div>

<script>
  /* ══════════════════════════════════════════
     FIREBASE — single initialisation
  ══════════════════════════════════════════ */
  const firebaseConfig = {
    apiKey: "AIzaSyBKqiNmEAuxyYWtyqITZ0NSrEnzJIuO1_o",
    authDomain: "fahim-auni-wedding.firebaseapp.com",
    projectId: "fahim-auni-wedding",
    storageBucket: "fahim-auni-wedding.firebasestorage.app",
    messagingSenderId: "695568427433",
    appId: "1:695568427433:web:205578eccac0f5b2be3cb8",
    databaseURL: "https://fahim-auni-wedding-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);
  const db        = firebase.database();
  const photosRef = db.ref('photos');

  /* ══════════════════════════════════════════
     FLOATING PETALS
  ══════════════════════════════════════════ */
  (function spawnPetals() {
    const emojis = ['🌸','🌺','🦋','✨','💛'];
    setInterval(() => {
      const p = document.createElement('div');
      p.className = 'petal petal-' + ((Math.random()*3|0)+1);
      p.textContent = emojis[Math.random()*emojis.length|0];
      p.style.left = Math.random()*100 + '%';
      p.style.top  = '-30px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 9500);
    }, 1800);
  })();

  /* ══════════════════════════════════════════
     IMAGE PROCESSING
     Two sizes generated from every photo:
       thumb  — 400px wide @ 0.60 quality (~35KB) → gallery
       full   — 1100px wide @ 0.80 quality (~280KB) → lightbox only
  ══════════════════════════════════════════ */
  function resizeImage(bitmap, maxDim, quality) {
    const scale  = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width  * scale);
    const h = Math.round(bitmap.height * scale);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(bitmap, 0, 0, w, h);
    return c.toDataURL('image/jpeg', quality);
  }

  /* ══════════════════════════════════════════
     NATIVE CAMERA
  ══════════════════════════════════════════ */
  let originalThumb = null; // 400px base64 — shown in preview
  let originalFull  = null; // 1100px base64 — uploaded as full
  let capturedThumb = null; // final thumb (may be flipped)
  let capturedFull  = null; // final full  (may be flipped)
  let isFlipped     = false;
  let currentFrame  = 'none';

  const nativeInput = document.getElementById('native-input');
  const previewImg  = document.getElementById('preview-img');

  nativeInput.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;

    // Reset state
    isFlipped = false;
    currentFrame = 'none';
    document.getElementById('flip-btn').classList.remove('active');
    document.getElementById('flip-btn').textContent = '🔁 Flip / Mirror';
    document.querySelectorAll('.frame-opt').forEach(b => b.classList.remove('selected'));
    document.querySelector('[data-frame="none"]').classList.add('selected');
    document.getElementById('sticker-layer').innerHTML = '';

    try {
      // createImageBitmap handles EXIF orientation natively
      const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });

      // Generate BOTH sizes from the same bitmap decode (efficient — decode once)
      originalThumb = resizeImage(bitmap, 400,  0.60); // gallery thumbnail
      originalFull  = resizeImage(bitmap, 1100, 0.80); // lightbox full
      bitmap.close(); // free GPU memory immediately

    } catch (err) {
      // Fallback: FileReader for older browsers — only generates thumb for preview
      await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = ev => {
          originalThumb = ev.target.result;
          originalFull  = ev.target.result;
          resolve();
        };
        reader.readAsDataURL(file);
      });
    }

    capturedThumb = originalThumb;
    capturedFull  = originalFull;
    previewImg.src = originalThumb; // show thumbnail in preview (fast)

    document.getElementById('snap-area').style.display     = 'none';
    document.getElementById('preview-wrapper').style.display = 'block';
    document.getElementById('cancel-btn').style.display    = 'flex';
    document.getElementById('post-capture').style.display  = 'block';
    previewImg.onload = () => drawFramePreview();
    if (previewImg.complete) drawFramePreview();
  });

  /* ── Flip toggle ── */
  function toggleFlip() {
    isFlipped = !isFlipped;
    const btn = document.getElementById('flip-btn');
    btn.classList.toggle('active', isFlipped);
    btn.textContent = isFlipped ? '🔁 Flipped — tap to undo' : '🔁 Flip / Mirror';

    // Flip both thumb and full versions together
    [
      [originalThumb, t => capturedThumb = t],
      [originalFull,  t => capturedFull  = t]
    ].forEach(([src, setter]) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        if (isFlipped) { ctx.translate(img.naturalWidth, 0); ctx.scale(-1,1); }
        ctx.drawImage(img, 0, 0);
        setter(c.toDataURL('image/jpeg', 0.82));
        if (src === originalThumb) previewImg.src = capturedThumb;
      };
      img.src = src;
    });
  }

  function retake() {
    originalThumb = originalFull = capturedThumb = capturedFull = null;
    isFlipped = false;
    nativeInput.value = '';
    previewImg.src = '';
    document.getElementById('preview-wrapper').style.display = 'none';
    document.getElementById('cancel-btn').style.display = 'none';
    document.getElementById('post-capture').style.display = 'none';
    document.getElementById('done-view').style.display = '';
    document.getElementById('note-input').value = '';
    document.getElementById('sticker-layer').innerHTML = '';
    const fc = document.getElementById('frame-canvas');
    fc.getContext('2d').clearRect(0, 0, fc.width, fc.height);
    document.getElementById('snap-area').style.display = 'flex';
  }

  /* ── Submit: compose final, upload thumb + full separately ── */
  async function submitPhoto() {
    if (!capturedThumb || !capturedFull) return;
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;

    // Show progress bar
    const bar  = document.getElementById('upload-progress-bar');
    const prog = document.getElementById('upload-progress');
    prog.style.display = 'block';
    bar.style.width = '10%';

    const note = document.getElementById('note-input').value.trim();
    try {
      // Bake frame + stickers into BOTH sizes
      bar.style.width = '30%';
      const [finalThumb, finalFull] = await Promise.all([
        composeFinal(capturedThumb, 'thumb'),
        composeFinal(capturedFull,  'full')
      ]);

      bar.style.width = '60%';

      // Single atomic write — thumb + full in one push
      await photosRef.push({
        thumb:     finalThumb,   // ~35KB — always loaded
        full:      finalFull,    // ~280KB — only loaded on lightbox tap
        note,
        timestamp: Date.now()
      });

      bar.style.width = '100%';
      document.getElementById('note-input').value = '';
      setTimeout(() => {
        prog.style.display = 'none';
        bar.style.width = '0%';
        showDone();
        showToast();
      }, 300);

    } catch (err) {
      prog.style.display = 'none';
      bar.style.width = '0%';
      btn.textContent = 'Try Again';
      btn.disabled = false;
    }
  }

  function showDone() {
    capturedThumb = capturedFull = null;
    document.getElementById('preview-wrapper').style.display = 'none';
    document.getElementById('post-capture').style.display   = 'none';
    document.getElementById('done-view').style.display      = 'flex';
  }

  function takeAnother() {
    document.getElementById('done-view').style.display = 'none';
    nativeInput.value = '';
    document.getElementById('snap-area').style.display = 'flex';
  }

  /* ══════════════════════════════════════════
     FRAME SELECTOR
  ══════════════════════════════════════════ */
  function selectFrame(btn, frame) {
    document.querySelectorAll('.frame-opt').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentFrame = frame;
    drawFramePreview();
  }

  function drawFramePreview() {
    const canvas  = document.getElementById('frame-canvas');
    const img     = document.getElementById('preview-img');
    if (!canvas || !img.offsetWidth) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = img.offsetWidth  * dpr;
    canvas.height = img.offsetHeight * dpr;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    applyFrame(ctx, W, H, currentFrame);
  }

  /* Shared frame drawing — used for preview canvas AND final compose */
  function applyFrame(ctx, W, H, frame) {
    if (frame === 'none') return;
    if (frame === 'gold') {
      const bw = Math.round(W * 0.018);
      ctx.strokeStyle = '#c9a84c';
      ctx.lineWidth = bw;
      ctx.strokeRect(bw/2, bw/2, W - bw, H - bw);
    } else if (frame === 'stamp') {
      const bw = Math.round(W * 0.015);
      ctx.strokeStyle = '#c9a84c';
      ctx.lineWidth = bw;
      ctx.setLineDash([bw*2, bw]);
      ctx.strokeRect(bw*2, bw*2, W - bw*4, H - bw*4);
      ctx.setLineDash([]);
      const fs = Math.round(W * 0.055);
      ctx.font = `bold ${fs}px 'Playfair Display', serif`;
      ctx.fillStyle = 'rgba(201,168,76,0.85)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('Fahim & Auni · 2027', W/2, H - bw*2);
    } else if (frame === 'hearts') {
      const fs = Math.round(W * 0.09);
      ctx.font = `${fs}px serif`;
      ctx.textAlign = 'center';
      const icons = ['💍','💍','💍'];
      const gap = W / (icons.length + 1);
      ctx.textBaseline = 'top';
      icons.forEach((ic,i) => ctx.fillText(ic, gap*(i+1), fs*0.05));
      ctx.textBaseline = 'bottom';
      icons.forEach((ic,i) => ctx.fillText(ic, gap*(i+1), H - fs*0.05));
    } else if (frame === 'floral') {
      const fs = Math.round(W * 0.10);
      ctx.font = `${fs}px serif`;
      ctx.textAlign = 'left';  ctx.textBaseline = 'top';    ctx.fillText('🌸', 0, 0);
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';    ctx.fillText('🌸', W, 0);
      ctx.textAlign = 'left';  ctx.textBaseline = 'bottom'; ctx.fillText('🌸', 0, H);
      ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('🌸', W, H);
    }
  }

  /* ══════════════════════════════════════════
     STICKERS
  ══════════════════════════════════════════ */
  function addSticker(emoji) {
    const layer = document.getElementById('sticker-layer');
    const s = document.createElement('div');
    s.className = 'placed-sticker';
    s.textContent = emoji;
    s.style.left = (25 + Math.random()*50) + '%';
    s.style.top  = (25 + Math.random()*50) + '%';
    layer.appendChild(s);
    makeDraggable(s);
  }

  function makeDraggable(el) {
    let startX, startY, startLeft, startTop;
    const pct = (px, dim) => (px/dim)*100;

    el.addEventListener('touchstart', e => {
      e.stopPropagation();
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      startLeft = parseFloat(el.style.left);
      startTop  = parseFloat(el.style.top);
    }, { passive: true });

    el.addEventListener('touchmove', e => {
      e.stopPropagation(); e.preventDefault();
      const t = e.touches[0];
      const r = el.parentElement.getBoundingClientRect();
      el.style.left = Math.min(95, Math.max(5, startLeft + pct(t.clientX - startX, r.width)))  + '%';
      el.style.top  = Math.min(95, Math.max(5, startTop  + pct(t.clientY - startY, r.height))) + '%';
    }, { passive: false });

    el.addEventListener('mousedown', e => {
      e.stopPropagation();
      const r = el.parentElement.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      startLeft = parseFloat(el.style.left);
      startTop  = parseFloat(el.style.top);
      const onMove = e => {
        el.style.left = Math.min(95, Math.max(5, startLeft + pct(e.clientX - startX, r.width)))  + '%';
        el.style.top  = Math.min(95, Math.max(5, startTop  + pct(e.clientY - startY, r.height))) + '%';
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    el.addEventListener('dblclick', () => el.remove());
    let lastTap = 0;
    el.addEventListener('touchend', () => {
      const now = Date.now();
      if (now - lastTap < 300) el.remove();
      lastTap = now;
    });
  }

  /* ══════════════════════════════════════════
     COMPOSE FINAL IMAGE (frame + stickers baked in)
     size: 'thumb' | 'full'
  ══════════════════════════════════════════ */
  function composeFinal(srcData, size) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const w = img.naturalWidth, h = img.naturalHeight;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);

        // Apply frame at full canvas resolution
        applyFrame(ctx, w, h, currentFrame);

        // Draw stickers (position from % → pixels)
        const layer = document.getElementById('sticker-layer');
        layer.querySelectorAll('.placed-sticker').forEach(s => {
          const sx = w * parseFloat(s.style.left)  / 100;
          const sy = h * parseFloat(s.style.top)   / 100;
          // Scale sticker size proportionally — thumb gets smaller stickers
          const sfs = Math.round(w * (size === 'thumb' ? 0.12 : 0.10));
          ctx.font = `${sfs}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(s.textContent, sx, sy);
        });

        // Thumb: lower quality; Full: higher quality
        resolve(c.toDataURL('image/jpeg', size === 'thumb' ? 0.65 : 0.80));
      };
      img.src = srcData;
    });
  }

  /* ══════════════════════════════════════════
     TOAST
  ══════════════════════════════════════════ */
  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ══════════════════════════════════════════
     LIGHTBOX — loads full image on demand
  ══════════════════════════════════════════ */
  function openLightbox(fullSrc, note) {
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lightbox-img');
    const spinner = document.getElementById('lightbox-spinner');

    lbImg.src = '';
    lbImg.classList.add('loading');
    spinner.style.display = 'block';
    document.getElementById('lightbox-note').textContent = note ? '"' + note + '"' : '';
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';

    // Lazy-load the full image only now
    const fullImg = new Image();
    fullImg.onload = () => {
      lbImg.src = fullSrc;
      lbImg.classList.remove('loading');
      spinner.style.display = 'none';
    };
    fullImg.src = fullSrc;
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
    document.body.style.overflow = '';
  }

  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  });

  /* ══════════════════════════════════════════
     GALLERY — paginated, thumbnail-first
     Strategy:
       • Initial load: newest 12 thumbs only (fast)
       • "Load more": fetch next 12
       • child_added: new photos prepended in real-time
       • Lightbox: pulls .full from the stored record on tap
  ══════════════════════════════════════════ */
  const gallery   = document.getElementById('gallery');
  const emptyEl   = document.getElementById('gallery-empty');
  const PAGE_SIZE = 12;

  let allKeys       = [];    // all Firebase keys, newest first
  let loadedItems   = {};    // key → item data, in memory
  let renderedCount = 0;
  let totalCount    = 0;
  let initialDone   = false;
  let lastTimestamp = 0;

  /* Step 1: Get all keys + metadata (NO image data yet) */
  photosRef.orderByChild('timestamp').once('value', snapshot => {
    const entries = [];
    snapshot.forEach(child => {
      entries.push({ key: child.key, ...child.val() });
      if (child.val().timestamp > lastTimestamp) lastTimestamp = child.val().timestamp;
    });
    entries.reverse(); // newest first

    totalCount = entries.length;
    updateCount(totalCount);

    if (entries.length === 0) {
      emptyEl.style.display = 'block';
      initialDone = true;
      return;
    }
    emptyEl.style.display = 'none';

    // Store all items in memory (thumb + full are already in the data)
    entries.forEach(item => { loadedItems[item.key] = item; });
    allKeys = entries.map(e => e.key);

    // Render first page immediately
    renderPage(0, PAGE_SIZE);
    renderedCount = Math.min(PAGE_SIZE, allKeys.length);

    // Show load more if there are more
    if (allKeys.length > PAGE_SIZE) {
      document.getElementById('load-more-wrap').style.display = 'block';
    }

    initialDone = true;
  });

  /* Step 2: Only listen for genuinely new photos */
  photosRef.orderByChild('timestamp').on('child_added', snapshot => {
    if (!initialDone) return;
    const item = snapshot.val();
    if (item.timestamp <= lastTimestamp) return;

    lastTimestamp = item.timestamp;
    const entry = { key: snapshot.key, ...item };

    // Prepend to our data structures
    allKeys.unshift(entry.key);
    loadedItems[entry.key] = entry;
    totalCount++;
    renderedCount++;
    updateCount(totalCount);

    emptyEl.style.display = 'none';
    gallery.insertBefore(makeCard(entry), gallery.firstChild);
  });

  function renderPage(from, count) {
    const slice = allKeys.slice(from, from + count);
    slice.forEach(key => {
      const item = loadedItems[key];
      if (item) gallery.appendChild(makeCard(item));
    });
  }

  function loadMore() {
    const from = renderedCount;
    renderPage(from, PAGE_SIZE);
    renderedCount = Math.min(renderedCount + PAGE_SIZE, allKeys.length);
    if (renderedCount >= allKeys.length) {
      document.getElementById('load-more-wrap').style.display = 'none';
    }
  }

  /* ── Make gallery card (uses thumb for display) ── */
  function makeCard(item) {
    const card = document.createElement('div');
    card.className = 'g-card';

    // Use thumb if available, fall back to full/image for old records
    const thumbSrc = item.thumb || item.image || item.full || '';
    const fullSrc  = item.full  || item.image || item.thumb || '';

    // Skeleton shown until image loads
    const skeleton = document.createElement('div');
    skeleton.className = 'thumb-skeleton';
    card.appendChild(skeleton);

    const img = document.createElement('img');
    img.className = 'thumb';
    img.alt = 'Guest photo';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.onload = () => skeleton.remove();
    img.onerror = () => skeleton.remove();
    img.src = thumbSrc;
    card.appendChild(img);

    if (item.note) {
      const p = document.createElement('p');
      p.className = 'g-note';
      p.textContent = item.note;
      card.appendChild(p);
    }

    // Tap → load full image in lightbox
    card.addEventListener('click', () => openLightbox(fullSrc, item.note));
    return card;
  }

  /* ── Photo count ── */
  let _totalPhotos = 0;
  function updateCount(n) {
    _totalPhotos = n;
    const el  = document.getElementById('photo-count');
    const num = document.getElementById('photo-num');
    num.textContent = n;
    el.style.display = n > 0 ? 'block' : 'none';
  }
</script>
